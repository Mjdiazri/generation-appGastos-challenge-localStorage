<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Gastos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container my-4">
      <div class="row gx-3 gy-2 align-items-center">
       
        <div class="col-sm-3">
          <label class="visually-hidden" for="gasto">Descripcion Gasto</label>
          <input
            type="text"
            class="form-control"
            id="gasto"
            placeholder="Descripcion Gasto"
          />
        </div>

      
        <div class="col-sm-3">
          <label class="visually-hidden" for="monto">Monto</label>
          <div class="input-group">
            <div class="input-group-text">$</div>
            <input
              type="number"
              class="form-control"
              id="monto"
              placeholder="Monto"
            />
          </div>
        </div>

       
        <div class="col-sm-3">
          <label class="visually-hidden" for="categoria">Categoria</label>
          <select class="form-select" id="categoria">
            <option selected>Seleccione una opcion</option>
            <option value="1">Comida</option>
            <option value="2">Transporte</option>
            <option value="3">Entretenimiento</option>
            <option value="4">Servicios</option>
            <option value="5">Otros</option>
          </select>
        </div>

      
        <div class="col-auto">
          <button type="button" class="btn btn-primary" id="btn-guardar">
            Enviar
          </button>
        </div>
      </div>
    </div>


    <div class="container my-4">

      <div class="mb-3">
        <label for="total-hoy" class="form-label">Total Hoy</label>
        <input
          type="text"
          class="form-control"
          id="total-hoy"
          readonly
          value="0"
        />
      </div>
      <div class="mb-3">
        <label for="total-mes" class="form-label">Total Mes</label>
        <input
          type="text"
          class="form-control"
          id="total-mes"
          readonly
          value="0"
        />
      </div>

      <div class="mb-3">
        <label for="total-categoria" class="form-label">Total Categoria</label>
        <input
          type="text"
          class="form-control"
          id="total-categoria"
          readonly
          value="0"
        />
      </div>



      <div class="mb-3" id="padre">
        <h5>
            Detalle de gastos
        </h5>
        <p id="total-individual">
        </p>
      </div>

      <div class="col-auto mt-2">
        <button type="button" class="btn btn-danger" id="btn-eliminar">
          Eliminar 
        </button>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./app.js"></script>
  </body>
</html>
